<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>小遥 · Phone</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Sora:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #f2f6fb;
      --muted: rgba(242, 246, 251, 0.68);
      --accent: #7ae0c8;
      --bg: #071018;
      --font-display: "Noto Serif SC", "Songti SC", serif;
      --font-ui: "Sora", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; min-height: 100%;
      background: radial-gradient(120% 80% at 50% 0%, #143042 0%, var(--bg) 55%);
      color: var(--ink);
      font-family: var(--font-ui);
    }
    .app {
      min-height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
    }
    .brand { font-family: var(--font-display); font-size: 1.35rem; }
    .brand span { display: block; font-family: var(--font-ui); font-size: .62rem; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
    .state { color: var(--accent); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; }
    .portrait {
      border-radius: 22px;
      min-height: 42vh;
      background: url("/public/portrait.png") center 12% / cover no-repeat;
      box-shadow: 0 24px 48px rgba(0,0,0,.35);
    }
    .dialogue {
      margin-top: -48px;
      padding: 14px;
      border-radius: 18px;
      background: rgba(7,12,18,.55);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,.08);
      display: grid; gap: 10px;
    }
    .who { display:block; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase; color: var(--muted); margin-bottom: 3px; }
    .her .who { color: var(--accent); }
    .txt { font-family: var(--font-display); font-size: 1.05rem; line-height: 1.45; }
    .hint { font-size: .72rem; color: var(--muted); line-height: 1.4; }
    .dock { display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; }
    input {
      flex: 1; border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.28); color: var(--ink);
      border-radius: 14px; padding: 14px; font: inherit; outline: none;
    }
    button {
      appearance: none; border: 0; border-radius: 14px;
      padding: 14px 16px; font: inherit; font-weight: 600; cursor: pointer;
      background: rgba(122,224,200,.9); color: #041016;
    }
    button.ghost {
      background: rgba(255,255,255,.08); color: var(--ink); font-weight: 500;
    }
    .status { font-size: .68rem; color: var(--muted); display:flex; justify-content: space-between; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display:inline-block; margin-right: 6px; background:#666; }
    .dot.on { background: var(--accent); }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">小遥<span>phone · companion</span></div>
      <div class="state" id="stateLabel">待命</div>
    </header>
    <main>
      <div class="portrait"></div>
      <div class="dialogue">
        <div class="bubble you">
          <span class="who">你</span>
          <span class="txt" id="youLine">打字发我，或在 HTTPS 下用麦克风</span>
        </div>
        <div class="bubble her">
          <span class="who">小遥</span>
          <span class="txt" id="herLine">我在这里。</span>
        </div>
        <p class="hint" id="hint">iPhone 麦克风需要 HTTPS（用 scripts/start-phone.sh）。同一 Wi‑Fi 的 http 地址可以打字。</p>
      </div>
    </main>
    <footer class="dock">
      <div class="row">
        <button class="ghost" id="listenBtn" type="button">麦克风</button>
        <input id="input" placeholder="说点什么…" enterkeyhint="send" />
        <button id="sendBtn" type="button">发送</button>
      </div>
      <div class="status">
        <span><i class="dot" id="dot"></i><span id="conn">connecting…</span></span>
        <span id="secure"></span>
      </div>
    </footer>
  </div>
  <script>
    const labels = { idle: "待命", listening: "聆听中", thinking: "思索中", speaking: "回应中" };
    const stateLabel = document.getElementById("stateLabel");
    const youLine = document.getElementById("youLine");
    const herLine = document.getElementById("herLine");
    const input = document.getElementById("input");
    const listenBtn = document.getElementById("listenBtn");
    const sendBtn = document.getElementById("sendBtn");
    const connEl = document.getElementById("conn");
    const dot = document.getElementById("dot");
    const secureEl = document.getElementById("secure");
    const hint = document.getElementById("hint");

    const isSecure = window.isSecureContext || location.protocol === "https:" || location.hostname === "localhost";
    secureEl.textContent = isSecure ? "安全上下文" : "非 HTTPS · 建议打字";
    if (!isSecure) {
      hint.textContent = "当前不是 HTTPS，iPhone 打不开麦克风。可以打字；要语音请用 Mac 上的 start-phone.sh 开隧道。";
      listenBtn.disabled = true;
      listenBtn.style.opacity = ".45";
    }

    let ws = null;
    let micOn = false;
    let companionState = "idle";
    let audioQueue = [];
    let audioPlaying = false;
    let playCtx = null;
    let playSrc = null;
    let audioUnlocked = false;
    let audioCtx = null;
    let mediaStream = null;
    let processor = null;
    let micActive = false;
    let micMuteUntil = 0;

    const SILENT_WAV =
      "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";

    function setState(s) {
      companionState = s;
      stateLabel.textContent = labels[s] || s;
    }

    function shouldSendMic() {
      if (!micActive) return false;
      if (audioPlaying || audioQueue.length) return false;
      if (companionState === "thinking" || companionState === "speaking") return false;
      if (Date.now() < micMuteUntil) return false;
      return true;
    }

    function armEchoGuard(ms) {
      micMuteUntil = Date.now() + Math.max(0, Number(ms) || 700);
    }

    async function unlockAudio() {
      try {
        const a = new Audio(SILENT_WAV);
        a.setAttribute("playsinline", "true");
        await a.play();
        a.pause();
      } catch (_) {}
      try {
        if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (playCtx.state === "suspended") await playCtx.resume();
        audioUnlocked = true;
      } catch (_) { audioUnlocked = false; }
    }

    function b64ToArrayBuffer(b64) {
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes.buffer;
    }

    async function playViaContext(b64) {
      if (!playCtx) playCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (playCtx.state === "suspended") await playCtx.resume();
      const buf = await playCtx.decodeAudioData(b64ToArrayBuffer(b64).slice(0));
      await new Promise((resolve, reject) => {
        try {
          if (playSrc) { try { playSrc.stop(); } catch (_) {} playSrc = null; }
          const src = playCtx.createBufferSource();
          src.buffer = buf;
          src.connect(playCtx.destination);
          src.onended = () => { playSrc = null; resolve(); };
          playSrc = src;
          src.start(0);
        } catch (err) { reject(err); }
      });
    }

    async function pumpAudio() {
      if (audioPlaying) return;
      const next = audioQueue.shift();
      if (!next) return;
      audioPlaying = true;
      try {
        if (!audioUnlocked) await unlockAudio();
        await playViaContext(next);
      } catch (err) {
        console.error(err);
      } finally {
        audioPlaying = false;
        if (!audioQueue.length) armEchoGuard(700);
        pumpAudio();
      }
    }

    function playWav(b64) {
      audioQueue.push(b64);
      armEchoGuard(1200);
      void pumpAudio();
    }

    function downsampleTo16k(input, inputRate) {
      const ratio = inputRate / 16000;
      const newLen = Math.floor(input.length / ratio);
      const out = new Int16Array(newLen);
      for (let i = 0; i < newLen; i++) {
        const s = Math.max(-1, Math.min(1, input[Math.floor(i * ratio)] || 0));
        out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }
      return out;
    }

    function pcmToBase64(pcm) {
      const bytes = new Uint8Array(pcm.buffer, pcm.byteOffset, pcm.byteLength);
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function stopMic() {
      micActive = false;
      try {
        processor && processor.disconnect();
        mediaStream && mediaStream.getTracks().forEach((t) => t.stop());
        audioCtx && audioCtx.close();
      } catch (_) {}
      processor = null; mediaStream = null; audioCtx = null;
    }

    async function startMic() {
      await unlockAudio();
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      mediaStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
      const source = audioCtx.createMediaStreamSource(mediaStream);
      processor = audioCtx.createScriptProcessor(4096, 1, 1);
      processor.onaudioprocess = (ev) => {
        if (!shouldSendMic() || !ws || ws.readyState !== 1) return;
        const inputData = ev.inputBuffer.getChannelData(0);
        const pcm = downsampleTo16k(inputData, audioCtx.sampleRate);
        ws.send(JSON.stringify({ type: "audio", data: pcmToBase64(pcm) }));
      };
      source.connect(processor);
      processor.connect(audioCtx.destination);
      micActive = true;
    }

    function sendText(text) {
      const t = (text || "").trim();
      if (!t || !ws || ws.readyState !== 1) return;
      youLine.textContent = t;
      ws.send(JSON.stringify({ type: "text", text: t }));
      input.value = "";
    }

    sendBtn.onclick = async () => { await unlockAudio(); sendText(input.value); };
    input.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") { ev.preventDefault(); sendBtn.click(); }
    });
    listenBtn.onclick = async () => {
      if (!isSecure) return;
      if (micOn) {
        stopMic();
        micOn = false;
        listenBtn.textContent = "麦克风";
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "listen", on: false }));
        return;
      }
      try {
        await startMic();
        micOn = true;
        listenBtn.textContent = "停止";
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "listen", on: true }));
      } catch (err) {
        hint.textContent = "麦克风权限没给到：" + (err && err.message ? err.message : err);
      }
    };

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws`);
      ws.onopen = () => {
        dot.classList.add("on");
        connEl.textContent = "已连接";
      };
      ws.onclose = () => {
        dot.classList.remove("on");
        connEl.textContent = "重连中…";
        if (micOn) { stopMic(); micOn = false; listenBtn.textContent = "麦克风"; }
        ws = null;
        setTimeout(connect, 2000);
      };
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "state" && msg.state) setState(msg.state);
        if (msg.type === "reply" && msg.text) herLine.textContent = msg.text;
        if (msg.type === "transcript" && msg.role === "user") youLine.textContent = msg.text;
        if (msg.type === "audio" && msg.data) playWav(msg.data);
        if (msg.type === "echo_guard") armEchoGuard(msg.ms || 700);
        if (msg.greeting) herLine.textContent = msg.greeting;
      };
    }
    connect();
  </script>
</body>
</html>
